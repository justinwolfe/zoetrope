<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zoetrope Frame</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #frame-image {
      max-width: 100vw;
      max-height: 100vh;
      object-fit: contain;
      display: none;
    }

    #frame-image.loaded {
      display: block;
    }
  </style>
</head>
<body>
  <img id="frame-image" alt="Animation frame">

  <script src="frame.js"></script>
</body>
</html>
